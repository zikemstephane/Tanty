<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="logo-section">
                <img src="/logo_tanty.jpg" alt="TANTY" class="logo-image" />
            </div>
            <h1>Bienvenue</h1>
            <p>Connectez-vous à votre espace ERP</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
            <div class="form-group">
                <label class="form-label">Matricule</label>
                <input type="text" class="form-control" formControlName="matricule" placeholder="Ex : COM001"
                    [class.is-error]="loginForm.get('matricule')?.touched && loginForm.get('matricule')?.invalid" />
                <div class="error-message" *ngIf="loginForm.get('matricule')?.touched && loginForm.get('matricule')?.invalid">
                    Le matricule est obligatoire
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Mot de passe</label>
                <div class="password-input">
                    <input [type]="showPassword ? 'text' : 'password'" class="form-control" formControlName="motDePasse"
                        placeholder="••••••••"
                        [class.is-error]="loginForm.get('motDePasse')?.touched && loginForm.get('motDePasse')?.invalid" />
                    <button type="button" class="toggle-password" (click)="togglePassword()">
                        <i [class]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                    </button>
                </div>
                <div class="error-message"
                    *ngIf="loginForm.get('motDePasse')?.touched && loginForm.get('motDePasse')?.invalid">
                    Le mot de passe doit contenir au moins 6 caractères
                </div>
            </div>

            <div class="error-message" *ngIf="errorMessage" style="margin-bottom: 12px; text-align:center;">
                {{ errorMessage }}
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-full" [disabled]="loginForm.invalid || loading">
                    <span *ngIf="!loading">Se connecter</span>
                    <span *ngIf="loading" class="spinner spinner-sm"></span>
                </button>
            </div>

            <div class="form-footer">
                <a (click)="goToForgotPassword()" class="forgot-link">
                    Mot de passe oublié ?
                </a>
            </div>
        </form>
    </div>
</div>
