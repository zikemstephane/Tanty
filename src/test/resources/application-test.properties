# ═══════════════════════════════════════════════════════════════════════════
# Profil « test » — base PostgreSQL réelle, isolée de la base de développement
# ═══════════════════════════════════════════════════════════════════════════
# Les tests s'exécutent contre erp_tanty_test, jamais contre erp_tanty_db :
# cette dernière porte les données de travail (ventes, tarifs, journal d'audit)
# qu'un test ne doit ni lire ni altérer.
#
# Créer la base une fois :
#   psql -U postgres -c "CREATE DATABASE erp_tanty_test ENCODING 'UTF8' TEMPLATE template0;"

spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/erp_tanty_test}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:stephane}
spring.datasource.driver-class-name=org.postgresql.Driver

# Le schéma est reconstruit à chaque campagne : les tests partent d'un état connu
# et ne laissent rien derrière eux.
spring.jpa.hibernate.ddl-auto=create-drop

# Flyway est neutralisé ici : le schéma de test est dérivé des entités, ce qui en
# fait précisément la référence à laquelle comparer le résultat des migrations.
# Laisser Flyway s'exécuter par-dessus ferait converger les deux par construction
# et priverait la comparaison de toute valeur.
spring.flyway.enabled=false

# Les jeux d'essai n'ont pas leur place dans une campagne de tests : chaque test
# construit les données dont il a besoin.
app.seeding.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ─── Dépendances externes neutralisées ────────────────────────────────────
# Seuls les consommateurs de messages sont désactivés. L'auto-configuration
# RabbitMQ reste active : RabbitMQConfig déclare un RabbitTemplate dont dépend
# StockEventRelay, et l'exclure empêcherait le contexte de démarrer. La fabrique
# de connexions n'ouvre rien tant qu'aucun message n'est publié.
spring.rabbitmq.listener.simple.auto-startup=false
spring.cache.type=none
spring.mail.host=localhost
spring.mail.port=3025

# Clé absente : les fonctions d'assistance IA restent inactives pendant les tests.
openai.api-key=

# ─── Paramètres métier ─────────────────────────────────────────────────────
# Valeurs identiques au développement, pour que les tests éprouvent les mêmes
# règles que celles appliquées en exécution réelle.
app.jwt.secret=TestOnlySecretKeyForTantyERPIntegrationTests2026MinimumLength256Bits
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
app.cors.allowed-origins=http://localhost:4200

app.caisse.seuil-securisation=500000
app.stock.seuil-alerte-central=100
app.stock.seuil-alerte-tampon=50
app.securite.max-tentatives-connexion=3
app.otp.duree-validite-minutes=5
app.sms.provider=log

logging.level.org.hibernate.SQL=WARN
logging.level.com.NTFOODS.Api_tanty=INFO
