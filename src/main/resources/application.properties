# ─── SERVEUR ──────────────────────────────────────────────────────────────────
server.port=8083
spring.application.name=NTFOODS-TANTY-ERP

# ─── BASE DE DONNÉES PostgreSQL ───────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/erp_tanty_db
spring.datasource.username=postgres
spring.datasource.password=stephane
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.datasource.url=jdbc:mysql://localhost:3306/tanty_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
#spring.datasource.username=root
#spring.datasource.password=
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ─── JPA / HIBERNATE ──────────────────────────────────────────────────────────
# ATTENTION : ddl-auto=update en dev seulement. En prod, utiliser Flyway avec ddl-auto=validate (§3.4)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
# ─── FLYWAY (migrations versionnées — §3.4) ──────────────────────────────────
# Flyway désactivé temporairement (JAR non disponible hors-ligne).
# Décommenter la dependency dans pom.xml et passer à true quand Maven Central est joignable.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
# Performance : batching JDBC + ordonnancement des écritures
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Douala

# ─── POOL DE CONNEXIONS HikariCP (performance / scalabilité) ──────────────────
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─── COMPRESSION HTTP (temps de réponse minimal) ──────────────────────────────
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/plain
server.compression.min-response-size=1024

# ─── CORS (origines frontend autorisées, séparées par des virgules) ───────────
# Angular dev = 4200 ; ajoutez ici l'URL de prod / Flutter web si nécessaire.
app.cors.allowed-origins=http://localhost:4200,http://localhost:8100,http://localhost:5000

# ─── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=NTFoodsTantyERPSecretKey2026UltraSecureBase64EncodedStringMinimum256Bits
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ─── SEUILS MÉTIER ────────────────────────────────────────────────────────────
app.caisse.seuil-securisation=500000
app.stock.seuil-alerte-central=100
app.stock.seuil-alerte-tampon=50
app.dotation.heure-limite-submission=18:00
app.dotation.heure-rappel-matin=07:00

# ─── SÉCURITÉ ANTI-FRAUDE (Pilier 3) ───────────────────────────────────────────
# Blocage automatique après 3 tentatives de connexion erronées (compte à débloquer par un admin)
app.securite.max-tentatives-connexion=3

# ─── OTP (opérations financières sensibles : versements, prix exceptionnels) ──
app.otp.duree-validite-minutes=5
# Fournisseur SMS : "log" = journalise le code (dev, aucune dépendance externe).
# En production, implémenter SmsGatewayPort avec un opérateur réel (Orange CM, MTN CM, Twilio...)
# et régler app.sms.provider en conséquence.
app.sms.provider=log

# ─── PRIMES COMMERCIALES — Règle d'or 80/75 ────────────────────────────────────
# Montant fixe (FCFA) versé si le commercial atteint >=80% de son objectif global
# ET >=75% sur CHAQUE gamme de produits.
app.prime.montant-hebdomadaire=12000

# ─── MAIL (notifications) ──────────────────────────────────────────────────────
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.expediteur=no-reply@tanty-erp.local

# ─── MINIO (archivage documentaire : BC, BR, BT, BD, factures, rapports...) ────
app.minio.endpoint=http://localhost:9000
app.minio.access-key=minioadmin
app.minio.secret-key=minioadmin
app.minio.bucket=tanty-erp-documents

# ─── ACTUATOR (supervision / disponibilité) ────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ─── RABBITMQ ─────────────────────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ─── WEBSOCKET ────────────────────────────────────────────────────────────────
app.websocket.endpoint=/ws
app.websocket.topic.notifications=/topic/notifications

# ─── SWAGGER / OpenAPI ────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ─── LOGGING ──────────────────────────────────────────────────────────────────
logging.level.com.NTFOODS=DEBUG
logging.level.org.springframework.security=WARN
