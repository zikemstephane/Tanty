spring.application.name=NTFOODS-TANTY-ERP

# PostgreSQL configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/erp_tanty_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:stephane}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration HikariCP Connection Pool pour la montée en charge
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
# Le schéma est piloté par Flyway. Hibernate ne le modifie plus : il se contente
# de vérifier au démarrage qu'il correspond aux entités, et refuse de démarrer
# sinon. Une migration oubliée se voit ainsi au lancement, et non en production
# sur la première requête qui touche la colonne manquante.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=16
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Douala
spring.jpa.open-in-view=false

# ─── FLYWAY ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Les bases déjà en service ne rejouent pas V1 : elles sont marquées comme
# étant déjà à la version 1, et reprennent à partir de V2. Une base neuve, elle,
# est vide et exécute V1 puis V2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema de reference initial

# Les sommes de contrôle des migrations déjà appliquées sont vérifiées :
# modifier après coup un fichier livré fait échouer le démarrage plutôt que de
# laisser diverger silencieusement deux environnements.
spring.flyway.validate-on-migrate=true

# ─── JEUX D'ESSAI ──────────────────────────────────────────────────────────────
# Désactivés par défaut : ils s'exécutaient jusqu'ici à chaque démarrage, y
# compris en production, où ils ont laissé des données fictives. À activer
# explicitement sur un poste de développement ou une base de démonstration.
app.seeding.enabled=${APP_SEEDING_ENABLED:false}

# Cache en mémoire (dev local sans Redis)
spring.cache.type=simple
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Configuration du serveur
server.port=8081
server.tomcat.max-threads=200
server.tomcat.accept-count=100

# ─── COMPRESSION HTTP ──────────────────────────────────────────────────────────
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/plain
server.compression.min-response-size=1024

# ─── CORS ──────────────────────────────────────────────────────────────────────
# Origines autorisées, par environnement. Le caractère « * » n'est jamais acceptable
# ici : l'API s'authentifie par jeton porteur, et une origine ouverte exposerait
# chaque poste à des requêtes émises depuis n'importe quel site tiers.
# En production, fournir APP_CORS_ALLOWED_ORIGINS (liste séparée par des virgules).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8082,http://localhost:8100,http://localhost:5000}

# ─── JWT ──────────────────────────────────────────────────────────────────────
# Secret de signature des jetons. La valeur ci-dessous ne vaut que pour le poste de
# développement : en production, fournir impérativement APP_JWT_SECRET, faute de quoi
# n'importe qui pourrait forger un jeton valide à partir du dépôt.
app.jwt.secret=${APP_JWT_SECRET:NTFoodsTantyERPSecretKey2026UltraSecureBase64EncodedStringMinimum256Bits}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ─── SEUILS MÉTIER ────────────────────────────────────────────────────────────
app.caisse.seuil-securisation=500000
app.stock.seuil-alerte-central=100
app.stock.seuil-alerte-tampon=50
app.dotation.heure-limite-submission=18:00
app.dotation.heure-rappel-matin=07:00

# ─── SÉCURITÉ ANTI-FRAUDE ─────────────────────────────────────────────────────
app.securite.max-tentatives-connexion=3

# ─── OTP ──────────────────────────────────────────────────────────────────────
# Second facteur sur les operations financieres sensibles - validation d'un
# versement et deblocage d'un prix exceptionnel.
#
# Coupe le 18/08/2026 a la demande du commanditaire : aucun code secret n'est
# exige pour l'instant. Le code de controle reste en place et intact ; remettre
# cette propriete a true le reactive sans aucune modification de source.
#
# Tant qu'elle vaut false, un versement peut etre valide et un prix
# exceptionnel accorde sur la seule autorite du role - c'est un affaiblissement
# assume, pas un oubli.
app.otp.enabled=${APP_OTP_ENABLED:false}
app.otp.duree-validite-minutes=5
app.sms.provider=log

# ─── MAIL ──────────────────────────────────────────────────────────────────────
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.expediteur=no-reply@tanty-erp.local

# ─── MINIO ─────────────────────────────────────────────────────────────────────
app.minio.endpoint=http://localhost:9000
app.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
app.minio.bucket=tanty-erp-documents

# ─── ACTUATOR ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ─── RABBITMQ ──────────────────────────────────────────────────────────────────
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=false

# ─── WEBSOCKET ─────────────────────────────────────────────────────────────────
app.websocket.endpoint=/ws
app.websocket.topic.notifications=/topic/notifications

# ─── SWAGGER / OpenAPI ─────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ─── LOGGING ───────────────────────────────────────────────────────────────────
logging.level.com.NTFOODS=DEBUG
logging.level.org.springframework.security=WARN

# ─── UPLOAD FICHIERS ───────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ═══════════════════════════════════════════════════════════
# IA MODULE — OpenRouter (GPT-OSS 120B)
# L'utilisateur fournira la clé via env var ou application-local.properties
# ═══════════════════════════════════════════════════════════
# Clé retirée du dépôt : il s'agit d'une clé tierce facturable, qui n'a pas à figurer
# dans un fichier versionné. Fournir OPENAI_API_KEY par variable d'environnement.
# À défaut, seules les fonctions d'assistance IA sont indisponibles — le reste de
# l'API démarre et fonctionne normalement.
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=https://openrouter.ai/api/v1/chat/completions
openai.model=openai/gpt-oss-120b
openai.temperature=0.2
openai.max-tokens=20000
openai.timeout-seconds=60

# ─── IA (Prévision) ───────────────────────────────────
ia.prevision.horizon-defaut=30
ia.prevision.min-historique-jours=14
ia.prevision.max-historique-jours=730
ia.alertes.auto-generer=true


APP_SEEDING_ENABLED=true